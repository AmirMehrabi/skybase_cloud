# Call in the successful post-auth section, after SQL reply attributes are loaded.
skybase_lease_post_auth {
    if (&reply:Class == 0x736b79626173652d73797374656d2d706f6f6c) {
        update reply {
            Class -= 0x736b79626173652d73797374656d2d706f6f6c
        }
        skybase_lease_allocate
        if (!(ok || updated) || !&reply:Framed-IP-Address) {
            reject
        }
    }
}

# Call after normal SQL accounting so an allocator outage still records usage.
skybase_lease_account {
    if (&Class =~ /^0x736b79626173652d6c656173653a/ && (&Acct-Status-Type == Start || &Acct-Status-Type == Interim-Update || &Acct-Status-Type == Stop)) {
        skybase_lease_accounting
    }
}
