; Supervisor configuration for /var/www/html/skybase_cloud
; Install this file as /etc/supervisor/conf.d/skybase-cloud.conf

[program:skybase-cloud-horizon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/html/skybase_cloud/artisan horizon
directory=/var/www/html/skybase_cloud
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/skybase_cloud/storage/logs/horizon-supervisor.log
stopwaitsecs=3600

[program:skybase-cloud-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/html/skybase_cloud/artisan schedule:work
directory=/var/www/html/skybase_cloud
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/skybase_cloud/storage/logs/scheduler-supervisor.log
stopwaitsecs=60

