exec skybase_lease_allocate {
    wait = yes
    program = "/usr/local/lib/skybase-radius/skybase-radius-lease.py allocate %{Packet-Src-IP-Address}"
    input_pairs = request
    output_pairs = reply
    shell_escape = no
    timeout = 3
}

exec skybase_lease_accounting {
    wait = yes
    program = "/usr/local/lib/skybase-radius/skybase-radius-lease.py accounting %{Packet-Src-IP-Address}"
    input_pairs = request
    shell_escape = no
    timeout = 3
}
